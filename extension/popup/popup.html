<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Masquer mon adresse e-mail</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="../icons/48.png" alt="" class="app-icon">
    <div class="top-text">
      <h1>Masquer mon adresse e-mail</h1>
      <p id="account" class="muted">iCloud+</p>
    </div>
  </header>

  <nav class="segmented" role="tablist">
    <button role="tab" id="tab-new" class="seg active" aria-selected="true">Nouvelle</button>
    <button role="tab" id="tab-list" class="seg" aria-selected="false">Mes adresses</button>
    <span class="seg-thumb"></span>
  </nav>

  <!-- Nouvelle adresse -->
  <main id="view-new" class="view">
    <section class="card address-card">
      <span class="caption">Adresse générée</span>
      <div class="address-row">
        <span id="address" class="address skeleton">chargement@icloud.com</span>
        <button id="regen" class="icon-btn" title="Autre adresse" aria-label="Générer une autre adresse">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>

    <section class="group">
      <label class="row">
        <span class="row-label">Libellé</span>
        <input id="label" type="text" maxlength="100" placeholder="ex. netflix.com" autocomplete="off">
      </label>
      <label class="row">
        <span class="row-label">Note</span>
        <input id="note" type="text" maxlength="500" placeholder="Facultatif" autocomplete="off">
      </label>
    </section>
    <p id="forward" class="footnote"></p>

    <button id="use" class="btn-primary" disabled>Utiliser cette adresse</button>
    <button id="copy-only" class="btn-plain" disabled>Copier seulement</button>
  </main>

  <!-- Succès -->
  <main id="view-done" class="view hidden">
    <div class="done">
      <svg class="check" viewBox="0 0 52 52"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-15"/></svg>
      <h2>Adresse prête</h2>
      <p id="done-address" class="done-address"></p>
      <p id="done-detail" class="muted"></p>
    </div>
    <button id="another" class="btn-plain">Créer une autre adresse</button>
  </main>

  <!-- Liste -->
  <main id="view-list" class="view hidden">
    <div class="search">
      <svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Rechercher" autocomplete="off">
    </div>
    <div id="list" class="list"></div>
  </main>

  <!-- Erreur -->
  <main id="view-error" class="view hidden">
    <div class="error">
      <div class="error-icon">!</div>
      <h2 id="error-title">Erreur</h2>
      <p id="error-detail" class="muted"></p>
      <div id="error-cmd" class="cmd hidden">
        <code>rclone config reconnect icloud:</code>
        <button id="copy-cmd" class="icon-btn" title="Copier la commande" aria-label="Copier la commande">
          <svg viewBox="0 0 24 24" width="16" height="16"><rect x="8" y="8" width="12" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-7A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </div>
    <button id="retry" class="btn-primary">Réessayer</button>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script src="../shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
